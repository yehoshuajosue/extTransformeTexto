<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extensão TT</title>

    <!-- Adicionando Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <!-- Link css -->
    <link rel="stylesheet" href="./css/style.css">

    <title>Extensão TT</title>
</head>
<body>
    <!-- <h2>Extensão TT</h2> -->

    <div class="container-pai">
        <header class="container-title">
            <img src="./icons/Logo-tT-Vetor-16.png" alt="logo">
            <p class="title">TRANSFORME textos</p>
        </header>
        <input class="input-text" type="text" name="text" id="input" placeholder="Digite o texto aqui" required>
    
    
        <div class="container-button">
            <div class="two-button">
                <button type="submit" class="btn" id="btnMaiuscula">MAIÚSCULA</button>
            <button type="submit" class="btn" id="btnMinuscula">minúscula</button>
            </div>
            <div class="capital">
                <button type="submit" class="btn" id="capitalizar">Capitalizar</button>
            </div>
        </div>


        <textarea name="resultado" id="resultado" placeholder=" Resultado"></textarea>
        <div class="clear">
                <button type="submit" class="btn" id="clear">Limpar</button>
            </div>
        <footer>
            <p>Para mais opções, visite</p>
            <a href="https://github.com/yehoshuajosue/extTransformeTexto">tiagoneves.com.br</a>
        </footer>

    </div>

    <script src="./JS/script.js"></script>

</body>
</html>
